name: Demo probe

# Measures the CPU cost of every lifecycle stage on the real datasets with few epochs, so the
# demonstration scale can be set from measurements. Nothing here is published.
on:
  workflow_dispatch:
  push:
    branches: [expanded-demo-2026-11-09]
    paths: [.github/workflows/demo-probe.yml, demo/configure.py]

permissions:
  contents: read
  actions: read

concurrency:
  group: demo-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lifecycle:
    name: Lifecycle ${{ matrix.dataset }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        dataset: [ogbn-arxiv, ogbn-proteins, ogbn-products, Roman-empire, PascalVOC-SP, COCO-SP, Peptides-func]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / ; free -g ; nproc ; lscpu | grep -E 'Model name|^CPU\(s\)'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the recorded CPU environment
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "$(python -B environment/check_environment.py --bootstrap)"
          python -m pip install -r environment/requirements-cpu.lock
          python -m pip check
          python -B environment/check_environment.py || true
      - name: Probe configuration
        run: |
          python -B demo/configure.py --variant probe --dataset "${{ matrix.dataset }}" --output "$RUNNER_TEMP/configs"
          ls "$RUNNER_TEMP/configs"
      - name: Run the eight stages
        id: run
        run: |
          set -o pipefail
          cfg=$(ls "$RUNNER_TEMP"/configs/*.json)
          start=$(date +%s)
          timeout 300m /usr/bin/time -v python -B run_cross_morse.py --config "$cfg" --dataset "${{ matrix.dataset }}" \
            --data-root "$RUNNER_TEMP/data" --output-dir "$RUNNER_TEMP/run" --device cpu --threads 4 \
            > "$RUNNER_TEMP/run.log" 2>&1 || echo "exit=$?" >> "$RUNNER_TEMP/run.log"
          echo "wall_seconds=$(( $(date +%s) - start ))" >> "$RUNNER_TEMP/run.log"
          tail -n 60 "$RUNNER_TEMP/run.log"
      - name: Summary
        if: always()
        run: |
          grep -E "Maximum resident|Elapsed \(wall|exit=|wall_seconds" "$RUNNER_TEMP/run.log" || true
          python - <<'EOF'
          import json, os, pathlib
          run = pathlib.Path(os.environ["RUNNER_TEMP"]) / "run"
          for p in sorted((run / "stages").glob("*.json")) if (run / "stages").is_dir() else []:
              d = json.loads(p.read_text())
              print(f"STAGE {d.get('stage'):9s} {d.get('status'):9s} {d.get('seconds_this_attempt', 0):10.1f} s")
          state = run / "run_state.json"
          if state.is_file():
              print("STATE", json.loads(state.read_text()).get("status"), json.loads(state.read_text()).get("last_complete_stage"))
          failure = run / "failure_summary.json"
          if failure.is_file():
              print("FAILURE", json.loads(failure.read_text())["reason"][:2000])
          EOF
          du -sh "$RUNNER_TEMP/run"/* 2>/dev/null | sort -h | tail -12 || true
          du -sh "$RUNNER_TEMP/data" 2>/dev/null || true
          grep -n -i -E "epoch|seconds|stage" "$RUNNER_TEMP/run.log" | tail -n 40 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: probe-run-${{ matrix.dataset }}
          path: |
            ${{ runner.temp }}/run
            ${{ runner.temp }}/run.log
          if-no-files-found: ignore
          retention-days: 7

  plan:
    name: Plan the production graph on the probe runs
    needs: lifecycle
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install NumPy tools
        run: python -m pip install -c environment/requirements-cpu.lock -r requirements-review.txt scipy
      - name: Download the probe runs
        run: |
          mkdir -p "$RUNNER_TEMP/probe"
          gh run download "${{ github.run_id }}" --repo "${{ github.repository }}" --dir "$RUNNER_TEMP/probe" || true
          ls "$RUNNER_TEMP/probe"
      - name: Plan
        run: |
          args=()
          for ds in ogbn-arxiv ogbn-proteins ogbn-products PascalVOC-SP COCO-SP Peptides-func; do
            d="$RUNNER_TEMP/probe/probe-run-$ds/run"
            if [ -f "$d/run_state.json" ] && grep -q '"COMPLETE"' "$d/run_state.json"; then args+=(--run "$ds=$d"); fi
          done
          echo "runs: ${args[*]}"
          python -B scripts/paper_outputs.py plan "${args[@]}" --work "$RUNNER_TEMP/work" --allow-fixture --allow-subset || true
          python - <<'EOF'
          import json, os
          p = json.load(open(os.environ["RUNNER_TEMP"] + "/work/plan.json"))
          for n in p["nodes"]:
              cmds = n.get("tasks") or n.get("commands") or []
              print("NODE", n.get("name") or n.get("id"), n.get("resource"), n.get("array"), len(cmds))
              for c in cmds[:1]:
                  print("   ", " ".join(map(str, c))[:400] if isinstance(c, list) else str(c)[:400])
          EOF
