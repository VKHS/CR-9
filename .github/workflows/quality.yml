name: Verify on a fresh clone

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upload_reports:
        description: 'Upload downloadable CI reports (requires available Actions artifact storage)'
        type: boolean
        required: false
        default: false
  schedule:
    # Re-run source and example checks against the default branch each week.
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  verify:
    name: Source and example verification (no downloads or training)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the numeric-review dependencies from the recorded lock
        id: numeric_dependencies
        run: python -m pip install -c environment/requirements-cpu.lock -r requirements-review.txt 'matplotlib>=3.8,<4' scipy
      - name: Verify source, sealed artifacts and generated views
        run: make verify PYTHON=python
      - name: Check current manuscript report and all table and figure mappings
        run: make paper-report-check PYTHON=python
      - name: Replay the two bundled examples and build their tables and figures
        run: |
          make reproduce PYTHON=python REPORT_ROOT="$RUNNER_TEMP/reproduced-examples"
          make example-paper PYTHON=python PAPER_EXAMPLES_ROOT="$RUNNER_TEMP/example-paper"
          test -f "$RUNNER_TEMP/example-paper/tables/T1.tex"
          test -f "$RUNNER_TEMP/example-paper/figures/F1.png"
      - name: Build and verify one complete reconstruction workspace inventory
        run: |
          make reconstruction-example PYTHON=python RECONSTRUCTION_EXAMPLES_ROOT="$RUNNER_TEMP/reconstruction-examples"
          python -B scripts/reconstruct.py --verify "$RUNNER_TEMP/reconstruction-examples"
          python -c 'import json, os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/reconstruction-examples/reconstruction.json")); assert len(p["displays"]) == 90; assert p["outputs"]; assert p["synthetic_examples"]; assert not p["all_displays_numerically_reconstructed"]'
      - name: Archive, ingest and build tables from an ingested archive
        run: |
          python -B scripts/archive_run.py examples/runs/peptides_func --output "$RUNNER_TEMP/deposit/peptides.tar.gz"
          python -B scripts/archive_run.py --verify "$RUNNER_TEMP/deposit/peptides.tar.gz"
          python -B scripts/ingest_run.py "$RUNNER_TEMP/deposit/peptides.tar.gz" --runs-root "$RUNNER_TEMP/runs" --index "$RUNNER_TEMP/runs/index.json"
          python -B scripts/build_paper.py all --index "$RUNNER_TEMP/runs/index.json" --label ci --output-dir "$RUNNER_TEMP/ci-paper"
      - name: NumPy-only unit tests (records, exporters, campaign and baseline contracts, paper build)
        run: make test-no-torch PYTHON=python
      - name: Analytical statements with larger samples
        id: theory
        if: ${{ always() && !cancelled() && steps.numeric_dependencies.outcome == 'success' }}
        run: make theory-full PYTHON=python REPORT_ROOT="$RUNNER_TEMP/theory"
      - name: Supplementary arithmetic report
        id: si
        if: ${{ always() && !cancelled() && steps.numeric_dependencies.outcome == 'success' }}
        run: make si-report PYTHON=python REPORT_ROOT="$RUNNER_TEMP/theory"
      - name: Example record sets are traced to their raw files and their tables are current
        run: make example-records-check PYTHON=python
      - name: Claim-to-evidence ledger, availability page and manuscript paragraph are current
        run: |
          make claims-check PYTHON=python
          make availability-check PYTHON=python
          make availability-statement-check PYTHON=python
      - name: Inspect deposited baseline records for repeated-value patterns
        run: make degeneracy-check PYTHON=python REPORT_ROOT="$RUNNER_TEMP/guards"
      - name: Report printed policy discrepancies against the registered confirmation rule
        # A manuscript discrepancy is advisory here; malformed input remains a failure.
        run: make decision-check PYTHON=python DECISION_WARN_ONLY=1 REPORT_ROOT="$RUNNER_TEMP/guards"
      - name: Reviewer path on the bundled examples (no network, no official evidence)
        id: review
        run: make review PYTHON=python REVIEW_OFFLINE=1 REVIEW_ROOT="$RUNNER_TEMP/review"
      - name: Retain a readable report summary independently of artifact storage
        if: ${{ always() && !cancelled() }}
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('## Verification reports\n\nCorrectness checks remain mandatory. Report archival is a separate, optional operation.\n\n')
              out.write('Downloadable CI reports are disabled by default. To request them, use Run workflow and select upload_reports when Actions storage is available. Job summaries and execution logs do not require this option.\n\n')
              for relative in ('review/REVIEW_REPORT.md', 'theory/theory-full.md', 'theory/si-identities.md'):
                  path = root / relative
                  if path.is_file():
                      data = path.read_bytes()
                      out.write(f'### {relative}\n\nSHA-256: `{hashlib.sha256(data).hexdigest()}`\n\n')
                      text = data.decode('utf-8', errors='replace')
                      out.write(text[:12000] + ('\n\n[Summary truncated; detailed execution is retained in the job logs.]' if len(text)>12000 else '') + '\n\n')
              out.write('This workflow validates software and its bundled test inputs, not a fresh execution of the complete manuscript experiments.\n')
          PY
      - name: Publish the review, example and analytical reports as workflow artifacts
        id: report_upload
        # Downloads are opt-in; automatic verification never needs artifact storage.
        # Only this ancillary upload is nonfatal. All verification and test steps remain mandatory.
        continue-on-error: true
        if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.upload_reports == true && (steps.review.outcome == 'success' || steps.theory.outcome == 'success' || steps.si.outcome == 'success') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-report-and-example-displays
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/review/REVIEW_REPORT.md
            ${{ runner.temp }}/review/review.json
            ${{ runner.temp }}/review/review-*/CLAIMS.md
            ${{ runner.temp }}/review/review-*/AVAILABILITY_STATEMENT.txt
            ${{ runner.temp }}/review/review-*/*.json
            ${{ runner.temp }}/review/review-*/paper
            ${{ runner.temp }}/review/review-*/compare/comparison-*/*.json
            ${{ runner.temp }}/guards
            ${{ runner.temp }}/theory
            ${{ runner.temp }}/reconstruction-examples
      - name: Report an archival failure without misrepresenting verification
        if: ${{ always() && !cancelled() && steps.report_upload.outcome == 'failure' }}
        run: |
          echo '::warning::CI report archival failed. Inspect the upload step for the cause (including storage quota). Verification and test failures still fail this workflow. Existing releases and experimental artifacts were not removed.'
          printf '\n**CI report archival failed.** See the upload-step error. The readable summary and job logs remain available; no existing artifact was deleted.\n' >> "$GITHUB_STEP_SUMMARY"

  pytorch:
    name: Full test suite and one synthetic end-to-end run (CPU PyTorch)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the recorded CPU environment
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "$(python -B environment/check_environment.py --bootstrap)"
          python -m pip install -r environment/requirements-cpu.lock
          python -m pip check
          python -B environment/check_environment.py
      - name: Count all seven released full-profile models
        run: make model-inventory PYTHON=python REPORT_ROOT="$RUNNER_TEMP/model-inventory"
      - name: Complete unit-test suite
        run: make test PYTHON=python
      - name: Train one synthetic example end to end, archive it, ingest it, build its tables
        run: |
          make train-sample PYTHON=python DATASET=Peptides-func RUN_ROOT="$RUNNER_TEMP/runs/peptides" DATA_ROOT="$RUNNER_TEMP/data"
          python -B scripts/validate_run_manifest.py "$RUNNER_TEMP/runs/peptides"
          make reexecute PYTHON=python RUN_ROOT="$RUNNER_TEMP/runs/peptides" REPORT_ROOT="$RUNNER_TEMP/reports"
          python -B scripts/archive_run.py "$RUNNER_TEMP/runs/peptides" --output "$RUNNER_TEMP/deposit/peptides.tar.gz"
          python -B scripts/ingest_run.py "$RUNNER_TEMP/deposit/peptides.tar.gz" --runs-root "$RUNNER_TEMP/ingested" --index "$RUNNER_TEMP/ingested/index.json"
          python -B scripts/build_paper.py all --index "$RUNNER_TEMP/ingested/index.json" --label ci --output-dir "$RUNNER_TEMP/ci-paper"
          python -B scripts/export_records.py from-runs --set sensor_parameters --run "$RUNNER_TEMP/runs/peptides" --root "$RUNNER_TEMP/fresh-records"
          python -B scripts/export_records.py from-runs --set nominal_time --run "$RUNNER_TEMP/runs/peptides" --root "$RUNNER_TEMP/fresh-records"
