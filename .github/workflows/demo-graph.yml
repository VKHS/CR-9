          python -B demo/execute.py --work "$WORK" --status
      - name: Collect the record sets, campaigns and environment
        run: |
          python -B scripts/paper_outputs.py collect --work "$WORK" || true
          python - <<'EOF'
          import json, os
          m = json.load(open(os.environ["WORK"] + "/paper-artifacts.map.json"))
          for k, v in sorted(m.items()):
              if not k.startswith("_"):
                  print("PRODUCED " if v else "AWAITING ", k, (m.get("_awaiting") or {}).get(k, "")[:300])
          EOF
      - name: Save the collected outputs, the plan and its task markers
        run: |
          cd / && tar -czf "$RUNNER_TEMP/collected.tar.gz" "${WORK#/}/paper-artifacts.map.json" "${WORK#/}/plan.json" \
            "${WORK#/}/state" $(for d in records campaigns environment collect; do [ -e "$WORK/$d" ] && echo "${WORK#/}/$d"; done)
          ls -la "$RUNNER_TEMP/collected.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-collected
          path: ${{ runner.temp }}/collected.tar.gz
          retention-days: 30
