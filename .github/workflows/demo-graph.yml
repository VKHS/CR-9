name: Demo production graph

# Every record set, campaign and the observed environment of the CPU demonstration (demo/README.md),
# produced from the sealed demonstration runs of a "Demo runs" workflow run by the repository's own
# production graph (scripts/paper_outputs.py, planned with --allow-fixture --device cpu) and executed level
# by level on hosted CPU runners (demo/execute.py); the collected outputs are kept as the artifact
# demo-collected, which demo-publish.yml publishes.
on:
  push:
    branches: [expanded-demo-2026-11-09]
    paths: [demo/graph-request.json]
  workflow_dispatch:
    inputs:
      runs_run_id:
        description: run id of the "Demo runs" workflow whose sealed runs this graph uses
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: demo-graph-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  DEMO: /home/runner/demo
  WORK: /home/runner/demo/work
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      runs: ${{ steps.request.outputs.runs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the recorded CPU environment
        run: |
          python -m pip install -q --index-url https://download.pytorch.org/whl/cpu "$(python -B environment/check_environment.py --bootstrap)"
          python -m pip install -q -r environment/requirements-cpu.lock
      - id: request
        name: The request (dispatch inputs, else demo/graph-request.json)
        run: |
          if [ -n "${{ inputs.runs_run_id }}" ]; then
            echo "runs=${{ inputs.runs_run_id }}" >> "$GITHUB_OUTPUT"
          else
            python -c "import json; r=json.load(open('demo/graph-request.json')); print('runs=%s' % ' '.join([str(r['runs_run_id'])] + ['%s=%s' % kv for kv in sorted((r.get('overrides') or {}).items())])); print('resume=%s' % (r.get('resume_graph_run_id') or ''))" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
      - name: Sealed demonstration runs and reduced graphs
        run: bash demo/fetch_inputs.sh ${{ steps.request.outputs.runs }}
      - name: Plan the production graph on CPU, or resume an earlier graph run's plan and outputs
        run: |
          if [ -n "${{ steps.request.outputs.resume }}" ]; then
            bash demo/artifacts.sh demo-work- "$RUNNER_TEMP/previous" "${{ steps.request.outputs.resume }}"
            bash demo/work_delta.sh restore "$RUNNER_TEMP/previous/demo-work-base/base.tar.gz" \
              $(ls "$RUNNER_TEMP"/previous/demo-work-L*/*.tar.gz 2>/dev/null | sort)
          else
            # Declared demonstration choices: the ten Roman-empire split runs select different routes, and the
            # S14 family cannot join benchmark and fixture parents, so S14 covers the six reduced datasets; the
            # PascalVOC-SP run deploys no MPC-RH rule, so the Table S29 sweep names its swept configuration.
            python -B scripts/paper_outputs.py plan --runs "$DEMO/runs" --work "$WORK" --allow-fixture --device cpu \
              --data-root "$DEMO/data" --s14-exclude Roman-empire --horizon-sweep-profile full --horizon-sweep-ensemble 1
          fi
      - id: matrix
        run: |
          python -B demo/execute.py --work "$WORK" --status
          echo "matrix=$(python -B demo/execute.py --work "$WORK" --matrix 16)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Save the planned work directory
        run: |
          touch "$RUNNER_TEMP/epoch" -d '2000-01-01'
          bash demo/work_delta.sh save "$WORK" "$RUNNER_TEMP/epoch" "$RUNNER_TEMP/delta/base.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: demo-work-base
          path: ${{ runner.temp }}/delta/base.tar.gz
          retention-days: 30

  level0:
    name: Level 0 shard ${{ matrix.shard }}
    needs: plan
    if: ${{ always() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.matrix).l0 != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix).l0 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the recorded CPU environment
        run: |
          python -m pip install -q --index-url https://download.pytorch.org/whl/cpu "$(python -B environment/check_environment.py --bootstrap)"
          python -m pip install -q -r environment/requirements-cpu.lock
      - name: Inputs and earlier levels
        run: |
          bash demo/fetch_inputs.sh ${{ needs.plan.outputs.runs }} > /dev/null
          bash demo/artifacts.sh demo-work- "$RUNNER_TEMP/deltas"
          bash demo/work_delta.sh restore "$RUNNER_TEMP/deltas/demo-work-base/base.tar.gz" \
            $(ls "$RUNNER_TEMP"/deltas/demo-work-L*/*.tar.gz 2>/dev/null | sort)
          bash demo/work_delta.sh mark "$RUNNER_TEMP/mark"
      - name: Execute this shard
        run: |
          level="${GITHUB_JOB#level}"
          shards=$(python -c "import json,sys; print(len(json.loads(sys.argv[1])['l$level']))" '${{ needs.plan.outputs.matrix }}')
          python -B demo/execute.py --work "$WORK" --level "$level" --shard "${{ matrix.shard }}/$shards" \
            --parallel 2 --threads 4 --budget-minutes 290 --summary "$RUNNER_TEMP/summary.json"
          echo "LEVEL=$level" >> "$GITHUB_ENV"
      - name: Task logs of failures
        if: always()
        run: |
          python - <<'EOF'
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "summary.json"
          if p.is_file():
              for r in json.loads(p.read_text())["results"]:
                  if r.get("state") not in ("COMPLETE", "SKIPPED"):
                      print("=" * 30, r["node"], r["task"], r.get("state"))
                      print(pathlib.Path(r["log"]).read_text(errors="replace")[-6000:])
          EOF
      - name: Save this shard's outputs
        if: always()
        run: bash demo/work_delta.sh save "$WORK" "$RUNNER_TEMP/mark" "$RUNNER_TEMP/delta/L${LEVEL:-x}-${{ matrix.shard }}.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: demo-work-L${{ env.LEVEL }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/delta/
          retention-days: 30

