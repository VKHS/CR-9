name: CPU execution publication

# Publishes the CPU execution (demo/README.md): the sealed runs of the "CPU lifecycle runs" workflow and the
# record sets, campaigns and environment that the production graph collected (demo-collected) are
# packed (paper_artifacts.py pack --demo, one artifact at a time: demo/pack_each.py), published to the
# release demo-artifacts (publish --demo), rebuilt into every table and figure from the release
# (make demo-paper) and recorded in the branch: release/demo_artifacts.json, the views under
# demo/published/ and demo/RESULTS.md. Request: demo/publish-request.json {"graph_run_id": run holding
# demo-collected, "graph_runs": [every run that executed the main graph], "runs_run_id": ..., "overrides": {...},
# "extra": [{"run": ..., "artifact": "demo-collected-s29", "work": "/home/runner/demo/work-s29"}]}; an extra
# graph's artifacts are added to the main map (demo/merge_maps.py). "report_only": true rebuilds from the published
# release and records the results without packing or publishing again; "notes" state the cause of an absence.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: demo-publish
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  DEMO: /home/runner/demo
  WORK: /home/runner/demo/work
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Pack, publish, rebuild and record
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the recorded CPU environment
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          python -m pip install -q --index-url https://download.pytorch.org/whl/cpu "$(python -B environment/check_environment.py --bootstrap)"
          python -m pip install -q -r environment/requirements-cpu.lock
      - id: request
        name: Publication or results only (report_only rebuilds and records from the published release)
        run: |
          python -c "import json; print('report_only=' + json.dumps(bool(json.load(open('demo/publish-request.json')).get('report_only'))))" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: The runs and the collected outputs (demo/publish-request.json)
        run: |
          read -r runs graph < <(python -c "import json; r=json.load(open('demo/publish-request.json')); print(' '.join([str(r['runs_run_id'])] + ['%s=%s' % kv for kv in sorted((r.get('overrides') or {}).items())]).replace(' ', ','), r['graph_run_id'])")
          bash demo/fetch_inputs.sh ${runs//,/ } > /dev/null
          bash demo/artifact.sh demo-collected "$RUNNER_TEMP/collected" "$graph"
          tar -xzf "$RUNNER_TEMP/collected/collected.tar.gz" -C /
          python - <<'EOF' > "$RUNNER_TEMP/extra.txt"
          import json
          r = json.load(open("demo/publish-request.json"))
          for item in r.get("extra") or []:
              print(item["run"], item["artifact"], item["work"])
          EOF
          graphs="--graph $WORK"; reports=""
          for run in $(python -c "import json; r=json.load(open('demo/publish-request.json')); print(' '.join(str(x) for x in r.get('graph_runs') or [r['graph_run_id']]))"); do
            reports="$reports --graph-run 0=$run"
          done
          index=0
          while read -r run artifact work; do
            [ -n "${run:-}" ] || continue
            index=$((index + 1))
            bash demo/artifact.sh "$artifact" "$RUNNER_TEMP/extra-$index" "$run"
            tar -xzf "$RUNNER_TEMP/extra-$index/collected.tar.gz" -C /
            python -B demo/merge_maps.py "$WORK/paper-artifacts.map.json" "$work/paper-artifacts.map.json"
            graphs="$graphs --graph $work"; reports="$reports --graph-run $index=$run"
          done < "$RUNNER_TEMP/extra.txt"
          echo "GRAPH_RUN=$graph" >> "$GITHUB_ENV"
          echo "REPORT_GRAPHS=$graphs" >> "$GITHUB_ENV"
          echo "REPORT_RUNS=$reports" >> "$GITHUB_ENV"
      - name: Pack the CPU execution, one artifact at a time
        if: ${{ !fromJSON(steps.request.outputs.report_only) }}
        run: |
          python -B demo/pack_each.py --map "$WORK/paper-artifacts.map.json" --output-dir "$DEMO/staged" \
            --failures "$DEMO/pack-failures.json"
          du -sh "$DEMO/staged"; ls "$DEMO/staged" | head -80
      - name: Publish the release demo-artifacts
        if: ${{ !fromJSON(steps.request.outputs.report_only) }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # the tag names the commit whose tooling produced and publishes the CPU execution
        run: python -B scripts/paper_artifacts.py publish --demo --staged "$DEMO/staged" --target "${{ github.sha }}"
      - name: Rebuild every table and figure from the release, install the views, write the results
        run: |
          # the manifest is committed whatever the rebuild reports; RESULTS.md records its status and errors
          make demo-paper PYTHON=python DEMO_ARTIFACTS_ROOT="$DEMO/fetched" DEMO_PAPER_ROOT="$DEMO/paper" \
            || echo "make demo-paper exited $?"
          python -B scripts/paper_artifacts.py derive --demo --fetched "$DEMO/fetched" --workspace "$DEMO/paper" \
            || echo "derive --demo exited $?"
          python -c "import json; json.dump(json.load(open('demo/publish-request.json')).get('notes') or {}, open('$DEMO/notes.json', 'w'))"
          python -B demo/report.py --status "$DEMO/paper.status.json" $REPORT_GRAPHS --runs "$DEMO/runs" \
            --graphs "$DEMO/graphs" $REPORT_RUNS --pack-failures "$DEMO/pack-failures.json" --notes "$DEMO/notes.json" \
            --workspace "$DEMO/paper" --output demo/RESULTS.md
          mkdir -p demo/published/graphs
          python -B -c 'import json, sys; sys.path.insert(0, "demo"); from data import SCOPE; from pathlib import Path
          for path in sorted(Path(sys.argv[1]).glob("*_demo.json")):
              record = dict(json.loads(path.read_text(encoding="utf-8")), scope=SCOPE)
              (Path("demo/published/graphs") / path.name).write_text(json.dumps(record, indent=2) + "\n", encoding="utf-8")' "$DEMO/graphs"
          python -B scripts/statement_check.py --write
          python -B scripts/artifact_catalog.py
          make manifest PYTHON=python
          git status --short | head -40
      - name: Commit the manifest, the views and the results
        run: |
          git config user.name "Abdolvahab Khalili Sadaghiani"
          git config user.email "32028020+VKHS@users.noreply.github.com"
          # the generated inventories are written again after the rebase onto the branch as it is now, so that
          # commits pushed while this run worked never conflict with them
          git checkout -- release/artifact_catalog.json RELEASE_MANIFEST.json SHA256SUMS.txt
          git add -A release/demo_artifacts.json demo/ STATEMENT_COMPLIANCE.md
          git commit -q -m "Record the published CPU execution (publication run ${{ github.run_id }}, graph run ${GRAPH_RUN})"
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          python -B scripts/statement_check.py --write
          python -B scripts/artifact_catalog.py
          make manifest PYTHON=python
          git add -A STATEMENT_COMPLIANCE.md release/artifact_catalog.json RELEASE_MANIFEST.json SHA256SUMS.txt
          git commit -q --amend --no-edit
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
          git log --oneline -1
