name: Demo publication

# Publishes the CPU demonstration (demo/README.md): the sealed runs of the "Demo runs" workflow and the
# record sets, campaigns and environment that a "Demo production graph" run collected (demo-collected) are
# packed (paper_artifacts.py pack --demo), published to the release demo-artifacts (publish --demo),
# rebuilt into every table and figure from the release (make demo-paper) and recorded in the branch:
# release/demo_artifacts.json, the views under demo/published/ and demo/RESULTS.md.
on:
  push:
    branches: [expanded-demo-2026-11-09]
    paths: [demo/publish-request.json]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: demo-publish
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  DEMO: /home/runner/demo
  WORK: /home/runner/demo/work
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Pack, publish, rebuild and record
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the recorded CPU environment
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          python -m pip install -q --index-url https://download.pytorch.org/whl/cpu "$(python -B environment/check_environment.py --bootstrap)"
          python -m pip install -q -r environment/requirements-cpu.lock
      - name: The runs and the collected outputs (demo/publish-request.json)
        run: |
          read -r runs graph < <(python -c "import json; r=json.load(open('demo/publish-request.json')); print(' '.join([str(r['runs_run_id'])] + ['%s=%s' % kv for kv in sorted((r.get('overrides') or {}).items())]).replace(' ', ','), r['graph_run_id'])")
          bash demo/fetch_inputs.sh ${runs//,/ } > /dev/null
          bash demo/artifact.sh demo-collected "$RUNNER_TEMP/collected" "$graph"
          tar -xzf "$RUNNER_TEMP/collected/collected.tar.gz" -C /
          echo "GRAPH_RUN=$graph" >> "$GITHUB_ENV"
      - name: Pack the demonstration
        run: |
          python -B scripts/paper_artifacts.py pack --demo --map "$WORK/paper-artifacts.map.json" --output-dir "$DEMO/staged"
          du -sh "$DEMO/staged"; ls "$DEMO/staged" | head -80
      - name: Publish the release demo-artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B scripts/paper_artifacts.py publish --demo --staged "$DEMO/staged"
      - name: Rebuild every table and figure from the release, install the views, write the results
        run: |
          make demo-paper PYTHON=python DEMO_ARTIFACTS_ROOT="$DEMO/fetched" DEMO_PAPER_ROOT="$DEMO/paper"
          python -B scripts/paper_artifacts.py derive --demo --fetched "$DEMO/fetched" --workspace "$DEMO/paper"
          python -B demo/report.py --status "$DEMO/paper.status.json" --graph "$WORK" --runs "$DEMO/runs" \
            --graphs "$DEMO/graphs" --graph-run "$GRAPH_RUN" --output demo/RESULTS.md
          mkdir -p demo/published/graphs && cp "$DEMO"/graphs/*_demo.json demo/published/graphs/
          python -B scripts/statement_check.py --write
          python -B scripts/artifact_catalog.py
          make manifest PYTHON=python
          git status --short | head -40
      - name: Commit the manifest, the views and the results
        run: |
          git config user.name "Abdolvahab Khalili Sadaghiani"
          git config user.email "32028020+VKHS@users.noreply.github.com"
          git add -A release/demo_artifacts.json demo/ STATEMENT_COMPLIANCE.md release/artifact_catalog.json RELEASE_MANIFEST.json SHA256SUMS.txt
          git commit -q -m "Record the published CPU demonstration (publication run ${{ github.run_id }}, graph run ${GRAPH_RUN})"
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
          git log --oneline -1
