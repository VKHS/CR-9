name: Verify released-artifact wording
on:
  push:
    branches: [clarify-artifact-release-2026-11-11]
    paths: [.github/workflows/artifact-wording-once.yml]
permissions:
  contents: write
jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install review dependencies
        run: python -m pip install -q -c environment/requirements-cpu.lock -r requirements-review.txt 'matplotlib>=3.8,<4' scipy
      - name: Verify release identities and preserve documentation
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          a=json.loads(Path('release/demo_artifacts.json').read_text())
          b=json.loads(Path('release/paper_artifacts.json').read_text())
          assert a['release_tag']=='demo-artifacts'
          assert b['release_tag']=='paper-artifacts'
          assert len(a['artifacts'])==len(b['artifacts'])==37
          assert sum(x['status']=='published' for x in a['artifacts'])==31
          assert sum(x['status']=='published' for x in b['artifacts'])==0
          protected={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in subprocess.check_output(['git','ls-files','-z']).decode().split('\0') if p and p not in {'RELEASE_MANIFEST.json','SHA256SUMS.txt','.github/workflows/artifact-wording-once.yml','release/artifact_catalog.json','docs/ARTIFACT_CATALOG.md','docs/badges/evidence.json','docs/badges/evidence.svg','paper/CLAIMS.md'}}
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP'])
          (tmp/'protected.json').write_text(json.dumps(protected))
          (tmp/'helper.yml').write_bytes(Path('.github/workflows/artifact-wording-once.yml').read_bytes())
          print('Verified two unchanged scientific artifact channels and protected file hashes')
          PY
          python -B scripts/artifact_catalog.py
          python -B scripts/claims_ledger.py
          python -B scripts/create_release_manifest.py --root . --output RELEASE_MANIFEST.json
          make verify PYTHON=python > "$RUNNER_TEMP/verify.log" 2>&1 || { tail -n 75 "$RUNNER_TEMP/verify.log"; exit 1; }
      - name: Regenerate target-tree source checksums and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/artifact-wording-once.yml
          python -B scripts/create_release_manifest.py --root . --output RELEASE_MANIFEST.json
          python -B scripts/create_release_manifest.py --root . --verify RELEASE_MANIFEST.json
          python -B - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP'])
          for name,expected in json.loads((tmp/'protected.json').read_text()).items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected,name
          Path('.github/workflows/artifact-wording-once.yml').write_bytes((tmp/'helper.yml').read_bytes())
          print('PASS: all protected files unchanged; target-tree checksums valid')
          PY
          git diff --check
          git add RELEASE_MANIFEST.json SHA256SUMS.txt release/artifact_catalog.json docs/ARTIFACT_CATALOG.md paper/CLAIMS.md docs/badges/evidence.json docs/badges/evidence.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh source integrity after artifact channel clarification'
          git push origin HEAD:clarify-artifact-release-2026-11-11
