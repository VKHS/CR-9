name: Prepare verified reviewer documentation

on:
  push:
    branches: [reviewer-wording-cleanup-2026-11-11]
    paths: [.github/workflows/reviewer-wording-once.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reviewer-wording-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.ref == 'refs/heads/reviewer-wording-cleanup-2026-11-11'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Execute the already-reviewed editorial transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import subprocess
          import textwrap
          src = subprocess.check_output([
              'git', 'show', '8bea2c1542e6e3bb4e1a6b4c9e556c1565f37c71:.github/workflows/reviewer-wording-once.yml'
          ], text=True)
          block = src.split('        run: |\n', 1)[1].split('\n      - name:', 1)[0]
          shell = textwrap.dedent(block)
          code = shell.split("python3 -B - <<'PY'\n", 1)[1].split('\nPY\n', 1)[0]
          exec(compile(code, '<reviewed-editor-8bea2c1>', 'exec'))
          PY
          git diff --check
      - name: Generate and verify checksums for the intended final tree
        run: |
          python3 -B scripts/create_release_manifest.py --root . --output RELEASE_MANIFEST.json
          python3 -B scripts/create_release_manifest.py --root . --verify RELEASE_MANIFEST.json
          git hash-object README.md demo/README.md docs/REVIEW_ENTRY.md .github/workflows/demo-verify.yml RELEASE_MANIFEST.json SHA256SUMS.txt
      - name: Publish documentation only; workflow edits use the repository integration
        shell: bash
        run: |
          set -euo pipefail
          # The Actions token cannot modify workflow files. Retain them in this
          # intermediate commit. The repository integration applies the two exact
          # workflow-path changes, completing the checksum-verified final tree.
          git restore --source=HEAD -- .github/workflows/demo-verify.yml .github/workflows/reviewer-wording-once.yml
          python3 -B - <<'PY'
          import subprocess
          allowed = {'README.md', 'demo/README.md', 'docs/REVIEW_ENTRY.md', 'RELEASE_MANIFEST.json', 'SHA256SUMS.txt'}
          changed = set(filter(None, subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0')))
          untracked = set(filter(None, subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z']).decode().split('\0')))
          assert (changed | untracked) <= allowed, sorted((changed | untracked) - allowed)
          PY
          git add README.md demo/README.md docs/REVIEW_ENTRY.md RELEASE_MANIFEST.json SHA256SUMS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply reviewer wording; stage final checksums for workflow cleanup'
          git push origin HEAD:reviewer-wording-cleanup-2026-11-11
