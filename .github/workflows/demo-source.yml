name: Expanded demo source
on:
  push:
    branches: [expanded-demo-2026-11-09]
    paths: [.github/workflows/demo-source.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Export tracked source
        run: |
          mkdir -p "$RUNNER_TEMP/demo-source"
          git archive --format=tar.gz --prefix=CR-9/ HEAD > "$RUNNER_TEMP/demo-source/CR-9-source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/demo-source/COMMIT.txt"
          cd "$RUNNER_TEMP/demo-source"
          sha256sum CR-9-source.tar.gz COMMIT.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expanded-demo-source
          path: ${{ runner.temp }}/demo-source/
          retention-days: 14
          if-no-files-found: error
