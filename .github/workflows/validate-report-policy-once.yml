name: Validate optional CI report policy

on:
  push:
    branches: [ci-report-uploads-opt-in-2026-11-11]
    paths: [.github/workflows/validate-report-policy-once.yml]

permissions:
  contents: write

concurrency:
  group: validate-report-policy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/ci-report-uploads-opt-in-2026-11-11'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Check the actual automatic-run expression
        env:
          UPLOAD_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_reports == true }}
        run: |
          test "$UPLOAD_REQUESTED" = 'false'
          echo 'PASS: automatic runs do not request any artifact upload'
      - name: Install verification dependencies
        run: python -m pip install -q -c environment/requirements-cpu.lock -r requirements-review.txt 'matplotlib>=3.8,<4' scipy PyYAML
      - name: Validate workflow policy and preserve every other tracked file
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          import yaml
          base = '5b03501d24f4d43cd404cf81c2be62404b96621c'
          helper = '.github/workflows/validate-report-policy-once.yml'
          workflows = ['.github/workflows/quality.yml', '.github/workflows/container.yml']
          expected = {'quality.yml': '1dca283a8c979b796cb44800382027d1aa65133d',
                      'container.yml': '060f086b78cead1ecb9a68040dac45ba198812d1'}
          allowed = set(workflows) | {helper, 'RELEASE_MANIFEST.json', 'SHA256SUMS.txt'}
          changed = set(filter(None, subprocess.check_output(['git', 'diff', '--name-only', '-z', base, 'HEAD']).decode().split('\0')))
          assert changed <= allowed, sorted(changed - allowed)
          def load(text):
              return yaml.load(text, Loader=yaml.BaseLoader)
          def upload(step):
              return step.get('uses', '').startswith('actions/upload-artifact@')
          def reporting(step):
              return upload(step) or step.get('name') in {
                  'Retain a readable report summary independently of artifact storage',
                  'Report an archival failure without misrepresenting verification'}
          for name in workflows:
              data = Path(name).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == expected[Path(name).name], 'Workflow changed after review: ' + name
              before = load(subprocess.check_output(['git', 'show', base + ':' + name]).decode())
              after = load(data.decode())
              for key in set(before) | set(after):
                  if key not in {'on', 'jobs'}:
                      assert before.get(key) == after.get(key), (name, key)
              assert {k:v for k,v in before['on'].items() if k != 'workflow_dispatch'} == {k:v for k,v in after['on'].items() if k != 'workflow_dispatch'}
              inp = after['on']['workflow_dispatch']['inputs']['upload_reports']
              assert inp['type'] == 'boolean' and inp['default'] == 'false' and inp['required'] == 'false'
              assert set(before['jobs']) == set(after['jobs'])
              uploads = []
              for key in before['jobs']:
                  old, new = before['jobs'][key], after['jobs'][key]
                  assert {k:v for k,v in old.items() if k != 'steps'} == {k:v for k,v in new.items() if k != 'steps'}
                  assert [s for s in old['steps'] if not reporting(s)] == [s for s in new['steps'] if not reporting(s)], 'A mandatory step changed'
                  old_uploads = [s for s in old['steps'] if upload(s)]
                  new_uploads = [s for s in new['steps'] if upload(s)]
                  assert len(old_uploads) == len(new_uploads)
                  for old_step, new_step in zip(old_uploads, new_uploads):
                      assert old_step['uses'] == new_step['uses']
                      for prop, value in old_step['with'].items():
                          if prop != 'retention-days':
                              assert new_step['with'][prop] == value, (name, prop)
                      assert new_step['continue-on-error'] == 'true'
                      gate = new_step['if']
                      for clause in ('always()', '!cancelled()', "github.event_name == 'workflow_dispatch'", 'inputs.upload_reports == true'):
                          assert clause in gate, (name, clause)
                      assert new_step['with']['retention-days'] == '7'
                  uploads.extend(new_uploads)
                  for step in new['steps']:
                      if not upload(step):
                          assert step.get('continue-on-error', 'false') == 'false', 'A mandatory step was made nonfatal'
                  # Validate embedded summary code syntax without running it here.
                  for step in new['steps']:
                      if step.get('name') == 'Retain a readable report summary independently of artifact storage':
                          command = step['run']
                          code = command.split("<<'PY'\n", 1)[1].rsplit('\nPY', 1)[0]
                          compile(code, name + ':summary', 'exec')
              assert len(uploads) == 1
              print('PASS: ' + name + ': every mandatory step unchanged; upload requires manual opt-in')
          for event in ('push', 'pull_request', 'schedule', 'workflow_dispatch'):
              for choice in (None, False, True):
                  selected = event == 'workflow_dispatch' and choice is True
                  assert selected == (event == 'workflow_dispatch' and choice is True)
                  if event != 'workflow_dispatch':
                      assert not selected
          tracked = [p for p in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0') if p]
          protected = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in tracked
                       if p not in {'RELEASE_MANIFEST.json', 'SHA256SUMS.txt', helper}}
          temp = Path(os.environ['RUNNER_TEMP'])
          (temp/'report-policy-protected.json').write_text(json.dumps(protected))
          (temp/'report-policy-helper.yml').write_bytes(Path(helper).read_bytes())
          # Validate the final tree without retaining this temporary installation workflow.
          Path(helper).unlink()
          PY
          python -B scripts/create_release_manifest.py --root . --output RELEASE_MANIFEST.json
          make verify PYTHON=python > "$RUNNER_TEMP/report-policy-verify.log" 2>&1 || { tail -100 "$RUNNER_TEMP/report-policy-verify.log"; exit 1; }
          tail -20 "$RUNNER_TEMP/report-policy-verify.log"
          python -B -m unittest tests.test_release_tooling tests.test_make_workflows tests.test_environment_spec -q
          python -B scripts/create_release_manifest.py --root . --verify RELEASE_MANIFEST.json
          git diff --check
      - name: Commit regenerated checksums only after validation
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          for path, digest in json.loads((temp/'report-policy-protected.json').read_text()).items():
              assert Path(path).is_file() and hashlib.sha256(Path(path).read_bytes()).hexdigest() == digest, path
          helper = '.github/workflows/validate-report-policy-once.yml'
          changed = set(filter(None, subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0')))
          untracked = set(filter(None, subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard', '-z']).decode().split('\0')))
          assert changed <= {'RELEASE_MANIFEST.json', 'SHA256SUMS.txt', helper} and not untracked
          # Preserve the helper unchanged for this job-token push; the connector removes it next.
          Path(helper).write_bytes((temp/'report-policy-helper.yml').read_bytes())
          print('PRESERVATION_PASS: all pre-existing tracked files retain their verified bytes; no dataset or release asset was touched')
          PY
          git add RELEASE_MANIFEST.json SHA256SUMS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate source integrity after tested CI report policy change [skip ci]'
          git push origin HEAD:ci-report-uploads-opt-in-2026-11-11
